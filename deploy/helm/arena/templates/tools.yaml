{{- /* Laya: typed decisions on the CPU. It reads its checkpoints from the library and reaches nothing; only the app reaches it. */}}
{{- if .Values.laya.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laya
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "laya") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "laya") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext: { runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true }
      containers:
        - name: laya
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.laya) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: LAYA_THREADS, value: {{ .Values.laya.threads | quote }} }
          resources: {{- toYaml .Values.laya.resources | nindent 12 }}
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 30 }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "arena.claim" (list "models" (include "arena.modelsClaim" .)) | nindent 8 }}
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: laya
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "laya") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: http }]
---
# The app's pods in, nothing out: as compose's internal network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: laya
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "laya") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "arena.selector" (dict "root" $ "name" "app") | nindent 14 }}
      ports: [{ port: 8000 }]
---
{{- end }}
{{- /* The security scanners: opengrep with Arena's rules, Bandit, gitleaks and Trivy's configuration checks, on a commit code-intel sends; SkillSpector on a skill the app sends. Only code-intel and the app reach them, and they reach nothing. */}}
{{- if .Values.scanners.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanners
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "scanners") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "scanners") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext: { runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true, fsGroup: 65534 }
      containers:
        - name: scanners
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.scanners) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 7800 }]
          env:
            - { name: SCANNERS_THREADS, value: "2" }
          resources: {{- toYaml .Values.scanners.resources | nindent 12 }}
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 30, timeoutSeconds: 10 }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Each scan's files in memory, as compose's tmpfs: gone when it ends.
        - { name: work, emptyDir: { medium: Memory, sizeLimit: 2Gi } }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: scanners
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "scanners") | nindent 4 }}
  ports: [{ name: http, port: 7800, targetPort: http }]
---
# code-intel's pods and the app's in (security reviews, and SkillSpector on skills), nothing out: as compose's internal network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scanners
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "scanners") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "arena.selector" (dict "root" $ "name" "code-intel") | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "arena.selector" (dict "root" $ "name" "app") | nindent 14 }}
      ports: [{ port: 7800 }]
---
{{- end }}
{{- /* The chat's web search. A new secret each start: it signs nothing that outlives the process. */}}
{{- if .Values.searxng.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "searxng") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "searxng") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      securityContext: { runAsUser: 977, runAsGroup: 977, runAsNonRoot: true }
      containers:
        - name: searxng
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.searxng) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [/bin/sh, -c, 'export SEARXNG_SECRET=$(od -An -N32 -tx1 /dev/urandom | tr -d " \n"); exec /usr/local/searxng/entrypoint.sh']
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/searxng/settings.yml, subPath: searxng.yml }
            - { name: cache, mountPath: /var/cache/searxng }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: arena-config } }
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "searxng") | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: http }]
{{- end }}
