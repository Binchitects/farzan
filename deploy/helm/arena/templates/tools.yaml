{{- /* The code index (GitLab, a read-only token) and knowledge packs, over MCP. */}}
{{- if .Values.codeIntel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-intel
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Its index is one file on its own volume: one code-intel at a time.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "code-intel") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "code-intel") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      containers:
        - name: code-intel
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.codeIntel) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - serve
            - --config=/etc/code-intel/config.yaml
            - --host=0.0.0.0
            - --port=7700
            - --allowed-host=code-intel
            - --allowed-host=code-intel:*
            - --allowed-host={{ .Values.codeIntel.host }}.{{ .Values.domain }}
            - --allowed-host={{ .Values.codeIntel.host }}.{{ .Values.domain }}:*
          ports: [{ name: http, containerPort: 7700 }]
          env:
            {{- include "arena.secretEnv" (list $ "CODE_INTEL_ADMIN_TOKEN" "CODE_INTEL_KEY") | nindent 12 }}
            {{- include "arena.secretEnv" (list $ "CODE_INTEL_CHAT_CLIENT_TOKEN" "CODE_INTEL_KEY") | nindent 12 }}
            # Coding agents connect with the person's API key (sk-...); the app says whose it is. GitLab tokens are refused.
            - { name: CODE_INTEL_KEY_CHECK_URL, value: "http://app:8080/api/authz/key" }
            - { name: CODE_INTEL_GITLAB_URL, value: {{ .Values.gitlab.url | quote }} }
            {{- include "arena.optionalSecretEnv" (list $ "CODE_INTEL_GITLAB_TOKEN" "GITLAB_TOKEN") | nindent 12 }}
            {{- include "arena.optionalSecretEnv" (list $ "CODE_INTEL_GITLAB_USERNAME" "GITLAB_USERNAME") | nindent 12 }}
            {{- include "arena.optionalSecretEnv" (list $ "CODE_INTEL_GITLAB_PASSWORD" "GITLAB_PASSWORD") | nindent 12 }}
            - { name: CODE_INTEL_GITLAB_VERIFY, value: {{ .Values.gitlab.verifyTls | quote }} }
            # The company CA the app trusts (gitlab.caCert and Settings), written for code-intel beside the directory.
            - { name: CODE_INTEL_GITLAB_CA_EXTRA, value: /directory/company-ca.pem }
            - { name: CODE_INTEL_GITLAB_LDAP, value: {{ .Values.gitlab.ldap | quote }} }
            - { name: CODE_INTEL_GITHUB_API, value: {{ .Values.codeHosts.githubApi | quote }} }
            - { name: CODE_INTEL_GITEA_URL, value: {{ .Values.codeHosts.giteaUrl | quote }} }
            - { name: CODE_INTEL_USERS_FILE, value: /directory/users.yml }
            - { name: CODE_INTEL_EMBED_URL, value: "http://embed:8080" }
            - { name: CODE_INTEL_APP, value: "off" }
            # The security scanners (scanners.enabled): security reviews send them the commit read.
            - { name: CODE_INTEL_SCANNERS_URL, value: "http://scanners:7800" }
            # The advisories pack, once installed, renewed each day from GitHub's advisory database and CISA's catalog.
            - { name: CODE_INTEL_ADVISORIES_RENEW_HOURS, value: "24" }
            {{- if .Values.codeIntel.packLibraryClaim }}
            - { name: CODE_INTEL_PACK_LIBRARY, value: /pack-library }
            {{- end }}
          # The image's own health check (compose runs it): code-intel answers /healthz on 127.0.0.1 only, past its host guard.
          readinessProbe: { exec: { command: [code-intel, healthcheck] }, periodSeconds: 30, timeoutSeconds: 10 }
          resources: {{- toYaml .Values.codeIntel.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/code-intel/config.yaml, subPath: code-intel.yaml }
            - { name: data, mountPath: /var/lib/code-intel }
            - { name: directory, mountPath: /directory, readOnly: true }
            {{- if .Values.codeIntel.packLibraryClaim }}
            - { name: pack-library, mountPath: /pack-library, readOnly: true }
            {{- end }}
      volumes:
        - { name: config, configMap: { name: arena-config } }
        {{- include "arena.claim" (list "data" .Values.codeIntel.claim) | nindent 8 }}
        {{- include "arena.claim" (list "directory" "arena-directory") | nindent 8 }}
        {{- if .Values.codeIntel.packLibraryClaim }}
        {{- include "arena.claim" (list "pack-library" .Values.codeIntel.packLibraryClaim) | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: code-intel
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "code-intel") | nindent 4 }}
  ports: [{ name: http, port: 7700, targetPort: http }]
---
{{- end }}
{{- /* The chat's Python: no network at all, a read-only root, each run its own user; the app hands it jobs through a volume. */}}
{{- if .Values.sandbox.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "sandbox") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "sandbox") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      automountServiceAccountToken: false
      # The pod's pause process is PID 1 and reaps what a run leaves behind (a document converter's
      # children), as compose's init: true; a run's own user sees it but cannot signal it.
      shareProcessNamespace: true
      containers:
        - name: sandbox
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.sandbox) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          resources: {{- toYaml .Values.sandbox.resources | nindent 12 }}
          env:
            # Its jobs at once, each job's memory (compose: SANDBOX_SLOTS, SANDBOX_JOB_MEMORY_MB).
            - { name: SANDBOX_SLOTS, value: {{ .Values.sandbox.slots | quote }} }
            - { name: SANDBOX_JOB_MEMORY_MB, value: {{ .Values.sandbox.jobMemoryMb | quote }} }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL] }
          volumeMounts:
            - { name: jobs, mountPath: /jobs }
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "arena.claim" (list "jobs" "arena-sandbox") | nindent 8 }}
        - { name: work, emptyDir: { sizeLimit: 1Gi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
# No way in or out: the sandbox's network is none, as in compose.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "sandbox") | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
{{- end }}
{{- /* Plugins' server code: each plugin its own worker, user and limits; only the app reaches it, and it reaches nothing. */}}
{{- if .Values.plugins.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugins
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "plugins") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "plugins") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      automountServiceAccountToken: false
      # The pause process reaps what a worker leaves behind, as compose's init: true.
      shareProcessNamespace: true
      containers:
        - name: plugins
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.plugins) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          resources: {{- toYaml .Values.plugins.resources | nindent 12 }}
          ports: [{ name: rpc, containerPort: 7700 }]
          # Ready when its port takes a connection, as compose's health check takes its socket's.
          readinessProbe: { tcpSocket: { port: rpc }, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: rpc }, periodSeconds: 30, failureThreshold: 4 }
          env:
            - { name: PLUGINS_LISTEN, value: "tcp:0.0.0.0:7700" }
            - { name: PLUGINS_MOST_MEMORY_MB, value: {{ .Values.plugins.mostMemoryMb | quote }} }
            - { name: PLUGINS_KEY, valueFrom: { secretKeyRef: { name: arena-plugins, key: PLUGINS_KEY } } }
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL] }
          volumeMounts:
            - { name: runtime, mountPath: /plugin-runtime }
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: runtime, emptyDir: { sizeLimit: 256Mi } }
        - { name: work, emptyDir: { sizeLimit: 1Gi } }
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: plugins
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "plugins") | nindent 4 }}
  ports: [{ name: rpc, port: 7700, targetPort: rpc }]
---
# Only the app in, on its port; nothing out (a plugin reaches the world only through the app's http.fetch).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plugins
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "plugins") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "arena.selector" (dict "root" $ "name" "app") | nindent 14 }}
      ports: [{ port: 7700 }]
---
{{- end }}
